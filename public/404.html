<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — nothing here but moonlight</title>
<meta name="theme-color" content="#05070f">
<link rel="stylesheet" href="/styles.css">
<style>
  body{display:grid;place-items:center;min-height:100svh;text-align:center;padding:24px}
  .code{font:400 clamp(4rem,14vw,9rem)/1 var(--serif);margin:0;color:var(--moon)}
  .msg{color:var(--moon-dim);font:400 14px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 32px}
  .back{display:inline-block;padding:13px 22px;border:1px solid var(--line-hi);border-radius:999px;color:var(--moon);text-decoration:none;font:500 14px/1 var(--sans)}
  .back:hover{border-color:var(--blue);background:var(--blue-soft)}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <p class="msg">the moonlight doesn't reach this page</p>
    <a class="back" href="/">← back to the light</a>
  </main>
</body>
</html>
